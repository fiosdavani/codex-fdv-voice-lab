name: FDV native integration offline gate
on:
  push:
    branches: [fdv/native-integration-20260914-01]
permissions:
  contents: read
jobs:
  rust-native:
    if: github.repository == 'fiosdavani/codex-fdv-voice-lab' && github.ref == 'refs/heads/fdv/native-integration-20260914-01' && !contains(github.event.head_commit.message, '[windows-ci-only]')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUST_BACKTRACE: '1'
      RUST_MIN_STACK: '8388608'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 16
          persist-credentials: false
      - name: Private disposable runner paths
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/fdv-tmp" "$RUNNER_TEMP/native-receipts"
          echo "RUSTUP_HOME=$RUNNER_TEMP/fdv-rustup" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/fdv-cargo" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/fdv-tmp" >> "$GITHUB_ENV"
          test "$(id -u)" != 0
          python3 -B fdv-native-ci/verify_delta.py
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy, rust-src
      - name: Reuse isolated native headers and pinned build tools
        shell: bash
        run: |
          python3 -B fdv-ci/provision_runner.py
          cargo install --locked --root "$RUNNER_TEMP/fdv-tools" --version 1.51.0 just
          cargo install --locked --root "$RUNNER_TEMP/fdv-tools" --version 0.9.103 cargo-nextest
          echo "$RUNNER_TEMP/fdv-tools/bin" >> "$GITHUB_PATH"
      - name: Native Core delta Rust proof
        shell: bash
        run: python3 -B fdv-native-ci/run_rust.py "$GITHUB_WORKSPACE" "$RUNNER_TEMP/native-receipts"
      - name: Preserve Rust receipts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: native-rust-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-receipts/
          if-no-files-found: error
          retention-days: 14
  windows-compile-mocks:
    if: github.repository == 'fiosdavani/codex-fdv-voice-lab' && github.ref == 'refs/heads/fdv/native-integration-20260914-01'
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 16
          persist-credentials: false
      - name: Source hashes
        run: python -B fdv-native-ci/verify_delta.py
      - name: Compile Windows SDK native adapter without device access
        run: |
          cmake -S fdv/windows-audio -B native-build -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build native-build --config Release
          exit $LASTEXITCODE
      - name: Mock policy tests only
        run: |
          ctest --test-dir native-build -C Release --output-on-failure --output-junit windows-mocks.xml
          exit $LASTEXITCODE
      - name: Node lifecycle and combined gate fake tests
        run: python -B fdv-native-ci/run_node.py . native-node-receipts
      - name: Preserve Windows compile and mock receipts
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: native-windows-mocks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            native-build/windows-mocks.xml
            native-build/Testing/Temporary/LastTest.log
            native-build/policy-mocks-receipt.json
            native-node-receipts/
          if-no-files-found: error
          retention-days: 14
