name: FDV P0 static Desktop acquisition

on:
  push:
    branches: [fdv/p0-acquisition-20260915-01]

permissions:
  contents: read
  actions: read

concurrency:
  group: fdv-p0-acquisition-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquisition:
    if: github.repository == 'fiosdavani/codex-fdv-voice-lab' && github.ref == 'refs/heads/fdv/p0-acquisition-20260915-01'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: fdv-p0
      - name: Retrieve only previous verified static artifacts
        working-directory: fdv-p0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir target previous-receipts receipts
          gh run download 34973146146 --repo fiosdavani/codex-fdv-voice-lab --name target-p0-bundles-34973146146-1 --dir target
          gh run download 34973146146 --repo fiosdavani/codex-fdv-voice-lab --name target-p0-evidence-34973146146-1 --dir previous-receipts
      - name: Focal static context after rehash of both bundles
        working-directory: fdv-p0
        run: python3 -B focus_target.py
      - name: Preserve bounded evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: target-p0-focus-${{ github.run_id }}-${{ github.run_attempt }}
          path: fdv-p0/receipts/
          if-no-files-found: error
          retention-days: 7
